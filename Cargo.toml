[package]
name = "ritstrend"
version = "0.1.0"
edition = "2021"
authors = ["RS Rajput"]
description = "Professional EOD Trend Following Scanner for NSE500"
license = "MIT"
repository = "https://github.com/rsrajput/ritstrend"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"